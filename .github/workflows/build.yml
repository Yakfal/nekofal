# GitHub Actions — CI build + free OSS code signing with SignPath Foundation
# SignPath Foundation ( https://signpath.org ) provides free code-signing
# certificates for qualifying open-source projects. This workflow builds the
# Windows setup/portable executables and, when the SignPath secrets are
# configured (see CODE_SIGNING_POLICY.md), submits them to SignPath for
# signing before attaching them to the release.
#
# To enable signing:
#   1. Apply at https://signpath.org/ and create a SignPath project + signing
#      policies (`test-signing`, `release-signing`).
#   2. Add GitHub Actions secrets SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID
#      (the free Foundation token/org id).
#   3. The optional github-extended-verification-token enables source/branch
#      provenance checks in the release policy.
#
# Without the SignPath secrets the workflow still builds and publishes the
# unsigned executables, exactly like the old release.yml flow.

name: Build and Sign Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release / attach assets
  actions: read     # SignPath reads job details + the uploaded artifact

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # electron-builder's extraResources step needs the binaries on disk first.
      - name: Prepare CLI binaries for packaging
        shell: bash
        run: |
          mkdir -p resources
          curl -L --fail -o resources/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L --fail -o "$TEMP/ffmpeg.zip" https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          cd resources
          unzip -o -j "$TEMP/ffmpeg.zip" '*/bin/ffmpeg.exe'
          ls -la

      - name: Build npm Packages (unsigned)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unsigned Artifacts for Signing
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekofal-unsigned
          if-no-files-found: error
          path: |
            dist/Nekofal-Setup-*.exe
            dist/Nekofal-*.exe
            dist/latest.yml

      # SignPath Foundation: submit a signing request for the artifacts above.
      # Guarded so the workflow still runs (unsigned) before approval lands.
      - name: Submit Signing Request (SignPath Foundation)
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        env:
          # `release-signing` policy for releases, `test-signing` otherwise.
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'Nekofal'
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'dist-signed'
          github-extended-verification-token: ${{ secrets.SIGNPATH_EXTENDED_VERIFICATION_TOKEN }}

      # When signing succeeded, use the signed binaries for the release.
      - name: Adopt Signed Artifacts
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        shell: bash
        run: |
          if [ -d dist-signed ] && ls dist-signed/ *.exe >/dev/null 2>&1; then
            mkdir -p dist
            cp -f dist-signed/*.exe dist/
          fi
          ls -la dist

      - name: Upload Signed Artifacts
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nekofal-signed
          path: dist-signed
          if-no-files-found: error

      - name: Publish GitHub Release (tag-only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Nekofal-Setup-*.exe
            dist/Nekofal-Setup-*.exe.blockmap
            dist/Nekofal-*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}