# GitHub Actions — build and publish Windows executables on every version tag
# Trigger: push a tag like v1.0.0  ->  git tag v1.0.0 && git push origin v1.0.0

name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # electron-builder's extraResources step needs the binaries on disk first.
      - name: Prepare CLI binaries for packaging
        shell: bash
        run: |
          mkdir -p resources
          curl -L --fail -o resources/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L --fail -o "$TEMP/ffmpeg.zip" https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          cd resources
          unzip -o -j "$TEMP/ffmpeg.zip" '*/bin/ffmpeg.exe'
          ls -la

      - name: Build React App & Electron Installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}