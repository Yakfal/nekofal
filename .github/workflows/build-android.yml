name: Build Android APK
# NOTE: This file is gitignored (/.github/workflows/) by repo convention
# ("CI workflows are kept local until the GitHub token gains workflow scope").
# To actually use it on GitHub you must either:
#   a) grant your PAT/secret the `workflow` scope and run:
#        git add -f .github/workflows/build-android.yml
#   b) or temporarily comment out the `/.github/workflows/` line in .gitignore
#      and commit the file normally.

on:
  workflow_dispatch:          # manual run from the Actions tab
  push:
    tags:                     # auto-build on every release tag v*
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest    # GitHub runners ship the Android SDK preinstalled
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (AGP 8.x requires JDK 17+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read version from package.json
        id: version
        run: echo "ver=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install Android SDK platform 36 + build-tools
        # Runner images pin a default platform; add the exact compileSdk this
        # project uses (36) so the build never falls back to a stale one.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache Gradle + npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json') }}

      - name: Install JS deps
        run: npm ci

      - name: Build web assets + cap sync
        run: |
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekofal-android-${{ steps.version.outputs.ver }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30