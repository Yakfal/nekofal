<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 320px; height: 180px; overflow: hidden; }
  .stage {
    width: 320px; height: 180px;
    background: radial-gradient(circle at 28% 40%, #12201a 0%, #0b0f17 75%);
    display: flex; align-items: center; gap: 20px;
    box-sizing: border-box; padding: 0 28px;
  }
  .logo { width: 95px; height: 95px; flex: 0 0 auto; }
  .logo img { display: block; width: 100%; height: 100%; }
  .copy { color: #e6f7f1; font-family: 'Segoe UI', Arial, sans-serif; }
  .name { font-size: 26px; font-weight: 700; letter-spacing: 1px; margin: 0; color: #ffffff; }
  .name span { color: #34d399; }
  .tag { font-size: 10px; color: #9fb3ac; margin: 6px 0 0; letter-spacing: 0.5px; }
  .bar { width: 40px; height: 3px; background: #10b981; border-radius: 2px; margin-top: 10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="logo"><img src="logo-512.png" alt=""></div>
  <div class="copy">
    <h1 class="name">Nekofal</h1>
    <p class="tag">Stream everything. Everywhere.</p>
    <div class="bar"></div>
  </div>
</div>
</body>
</html>
